<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akashic Dex — Semantic Comic Discovery & AI Recommendation Engine</title>
    <meta name="description" content="Describe a story and find the comic. Semantic search across 17,900+ manga, manhwa, and manhua — free, no account." />

    <!--
      Link previews. Static because this is an SPA with no SSR: crawlers read
      the served HTML and never run the bundle, so anything set from React
      would be invisible to them. og:image must be absolute for the same
      reason — Facebook and WhatsApp do not resolve relative paths.

      Regenerate the card with `python scripts/make-og-image.py`; it renders
      from the design tokens and the app's own fonts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akashic Dex" />
    <meta property="og:url" content="https://akashic-dex.vercel.app/" />
    <meta property="og:title" content="Akashic Dex — describe a story, find the comic" />
    <meta property="og:description" content="Semantic search across 17,900+ manga, manhwa, and manhua. Describe the plot in your own words and it finds the title. Free, no account." />
    <meta property="og:image" content="https://akashic-dex.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Akashic Dex — the query “cerita tentang raksasa yang memakan manusia di balik tembok” resolving to Attack on Titan." />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akashic Dex — describe a story, find the comic" />
    <meta name="twitter:description" content="Semantic search across 17,900+ manga, manhwa, and manhua. Describe the plot in your own words and it finds the title. Free, no account." />
    <meta name="twitter:image" content="https://akashic-dex.vercel.app/og-image.png" />

    <link rel="canonical" href="https://akashic-dex.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e4ddcd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120e" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Akashic Dex" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- The display voice and the reading voice, both wanted on the first frame. -->
    <link rel="preload" href="/fonts/anton-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jakarta-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — Weekly Anthology — seed ddfdd0df

      THESIS: The catalog is this week's issue, not a dashboard. It refuses the
      near-black card shell, the neon accent and the mono label — not the cover
      grid, which is where this catalog's real content lives. Covers print as
      mounted plates on paper. (Revised after the build: the user chose the
      plate gallery over the ranked contents list an earlier draft shipped, and
      a contract that still refused it would be describing a page nobody has.)

      OWN-WORLD: Tinted pulp paper under a halftone dot screen, dense process
      ink, one spot color per view. Anton for display, Plus Jakarta Sans for everything
      else, no monospace. Hairline rules instead of card shells; radius near
      zero.

      STORY: The reader lands mid-issue, reads a ranked table of contents where
      every entry carries the editor's one-line reason, and leaves with a title.

      FIRST VIEWPORT: Full-width masthead, issue line beneath it. Then the
      editorial desk — one ruled prompt field. Then the plates: a keylined
      cover grid, each entry carrying its title, the one-line reason it is
      here, and a credit line on a hairline. No card shells, no rank numerals.

      FORM: Weekly anthology periodical, candidate 5 of the grounded list,
      seed ddfdd0df.

      SIGNATURE INTERACTION: Plates strike the sheet as they arrive, staggered;
      the AI search runs a visible three-station press progression (retrieving,
      ranking, printing) instead of a spinner.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
