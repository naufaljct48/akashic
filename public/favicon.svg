<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    The publication's device, redrawn for the editorial edition.

    The geometry is unchanged from the original mark — hexagonal grimoire, an
    angular A, a knocked-out aperture, a spark, a rule beneath. What changed is
    the language: the crimson gradient and its drop-shadow glow belonged to the
    near-black build and had no counterpart left in the design system. A printed
    mark has flat inks, a hairline keyline and one spot colour, so that is what
    this is.

    It carries its own paper ground rather than sitting transparent, so it holds
    up on a light or a dark browser tab without a second variant.
  -->

  <!-- Hexagonal grimoire, printed as a keyline on its own stock -->
  <path
    d="M16 2L29 9.5V22.5L16 30L3 22.5V9.5L16 2Z"
    fill="#e4ddcd"
    stroke="#16130f"
    stroke-width="1.6"
  />

  <!-- The A, solid ink -->
  <path
    d="M16 6L24 22H19.5L17.5 17.5H14.5L12.5 22H8L16 6Z"
    fill="#16130f"
  />

  <!-- Aperture, knocked back out to the paper -->
  <polygon points="16,11 18.2,15.5 13.8,15.5" fill="#e4ddcd" />

  <!-- The one spot colour on the sheet -->
  <circle cx="16" cy="13.6" r="1.15" fill="#c1005c" />

  <!-- Rule -->
  <line x1="8" y1="24.6" x2="24" y2="24.6" stroke="#16130f" stroke-width="1.3" />
</svg>
